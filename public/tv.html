<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b18">
<title>Dropping live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
<style>
  body { overflow: hidden; }
  .tv { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr minmax(320px, 30vw); }
  .tv-stage { position: relative; overflow: hidden; perspective: 1400px; background: radial-gradient(ellipse at 50% 30%, #18245a, #05070f 70%); }
  .tv-tilt { position: absolute; inset: -30% -25% -10%; transform-origin: 50% 65%; transform: rotateX(40deg); will-change: transform; }
  .tv-tilt #map { position: absolute; inset: 0; background: transparent; }
  .tv-stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(#070b18 0%, rgba(7, 11, 24, 0) 28%), radial-gradient(ellipse at 50% 60%, transparent 55%, rgba(5, 7, 15, .85)); }
  .tv-title { position: absolute; top: 24px; left: 28px; z-index: 10; }
  .tv-title .logo { font-size: clamp(2rem, 3.4vw, 3.6rem); margin: 0; }
  .tv-clock { position: absolute; bottom: 24px; left: 28px; z-index: 10; display: flex; gap: 10px; align-items: center; }
  .tv-side { background: rgba(10, 16, 36, .92); border-left: 1px solid var(--line); padding: 22px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; }
  .tv-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, .04); margin-bottom: 8px; transition: transform .5s; }
  .tv-row .rank { font: 700 1.6rem "Space Grotesk", sans-serif; width: 34px; text-align: center; }
  .tv-row .sc { font: 700 1.5rem "Space Grotesk", sans-serif; }
  .tv-events { flex: 1; overflow: hidden; font-size: .95rem; }
  .tv-events div { padding: 6px 0; border-bottom: 1px solid var(--line); animation: slideIn .6s both; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } }
  .tv-photo { position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; background: #0b1020; display: none; }
  .tv-photo img { width: 100%; height: 100%; object-fit: cover; animation: kenburns 7s ease-out both; }
  @keyframes kenburns { from { transform: scale(1.12); opacity: 0; } 15% { opacity: 1; } to { transform: scale(1); } }
  .tv-photo .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px; background: linear-gradient(transparent, rgba(0, 0, 0, .8)); font-weight: 600; }
  .tv-label { background: rgba(5, 8, 20, .85) !important; color: #fff !important; border: 0 !important; font-weight: 700; font-size: 15px; box-shadow: 0 0 18px rgba(0, 0, 0, .6) !important; }
  .tv-label::before { display: none; }
  .tv-team { width: 26px; height: 26px; border-radius: 50%; border: 4px solid #fff; animation: beacon 1.8s infinite; }
  @keyframes beacon { 70% { box-shadow: 0 0 0 26px rgba(255, 255, 255, 0); } 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .6); } }
  .leaflet-control-attribution { opacity: .4; }
  @media (max-width: 800px) { .tv { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; } .tv-side { overflow: auto; } body { overflow: auto; } }
</style>
</head>
<body>
<div id="login" class="login-wrap" style="justify-content:center;display:none">
  <h1 class="logo">Tv-scherm</h1>
  <div class="card stack">
    <div><label for="adminPin">Beheerpincode</label><input id="adminPin" type="password"></div>
    <button class="btn block" id="adminGo">Start</button>
  </div>
</div>
<div class="tv" id="tv" style="display:none">
  <div class="tv-stage">
    <div class="tv-tilt"><div id="map"></div></div>
    <div class="tv-title"><h1 class="logo" id="title">Dropping</h1><span class="pill" id="live" style="color:var(--good)">● live</span> <span class="pill" id="camLabel">🎥 Overzicht</span></div>
    <div class="tv-clock">
      <button class="btn" id="replayBtn">▶ Replay van de routes</button>
      <span class="hud-chip" id="replayClock" style="display:none"></span>
      <button class="btn ghost small" id="fsBtn">⛶ Volledig scherm</button>
    </div>
  </div>
  <aside class="tv-side">
    <h2 style="margin:0">🏆 Stand</h2>
    <div id="board"></div>
    <div class="tv-photo" id="photo"><img id="photoImg" alt=""><div class="cap" id="photoCap"></div></div>
    <h3 style="margin:0">📣 Laatste nieuws</h3>
    <div class="tv-events" id="events"></div>
  </aside>
</div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/tv.js"></script>
</body>
</html>
